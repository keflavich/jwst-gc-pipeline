name: tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # install + pytest live in the composite action so that the merged-tree
      # check (retest-open-prs.yml) runs an identical environment
      - uses: ./.github/actions/pytest-suite
