name: merged-tree check

# Issue #249.  `tests.yml` runs when a branch is PUSHED and never again, so a
# green mark on a pull request describes the branch merged into the `main` of
# that moment.  When `main` moves, the mark is not recomputed and nothing
# recomputes it: two branches that are each green, each mergeable, and touch
# different lines can still produce a `main` that raises (#235 + #243 ->
# `NameError: name 'pool' is not defined`; #426 + #435 -> 21 failures in
# `test_stage12_loop_behavior.py`).  Both were found by hand, about an hour
# late.
#
# This workflow re-runs the suite on the merge result every time `main` moves,
# once per open pull request and once with all of them merged together.  The
# combined job is the only one of the two that can see an interaction while
# both branches are still open.
#
# THE MERGE IS PERFORMED HERE, not read from `refs/pull/N/merge`:
#   * GitHub recomputes that ref asynchronously after a push to `main`, so
#     checking it out can test the very staleness this workflow exists to
#     catch, while `git merge` against an explicit base SHA cannot;
#   * `gh run rerun` on the pull request's own run is worse still -- a re-run
#     reuses the original event's `GITHUB_SHA`, which for a `pull_request` is
#     the merge commit computed when the run was FIRST triggered, so it
#     replays the stale merge and reports green on it;
#   * a conflicting pull request has no merge ref at all, and `gh pr list`
#     answers `mergeable: UNKNOWN` until GitHub gets round to computing it
#     (4 of the 5 open pull requests on 2026-09-04), so selecting on
#     `mergeable == "MERGEABLE"` silently drops most of the population.
#
# A CONFLICTING PULL REQUEST GETS NO JOB.  `enumerate` decides mergeability by
# trying the merge, and only the pull requests that merge cleanly enter the
# matrix.  An earlier arrangement let the matrix job find the conflict itself,
# skip the suite step and conclude success, which put a green
# `PR #132 merged into main  pass  7s` beside a real
# `PR #544 merged into main  pass  29m58s` -- a green mark describing a tree
# nobody built, which is the state this workflow exists to catch.  Rendering
# such a job as SKIPPED instead is not available: `matrix` is not one of the
# contexts a job-level `if:` can read (github, needs, vars, inputs).  So the
# conflicting ones get no job and are named by the `conflicts` job below.
#
# This reports; it cannot block.  Blocking needs branch protection on `main`
# with `tests` as a required check -- a repository setting, see the pull
# request that added this file.

on:
  push:
    branches: [main]
  # so that the pull request which changes this workflow exercises it before
  # it lands -- a `push: [main]` trigger cannot be run from a branch, and
  # shipping an untestable CI change is how #374 went wrong
  pull_request:
    paths:
      - .github/workflows/retest-open-prs.yml
      - .github/actions/pytest-suite/action.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Read-only.  This workflow checks out and runs code from open pull requests,
# so it must hold nothing worth stealing.
permissions:
  contents: read
  pull-requests: read

jobs:
  enumerate:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
      mergeable: ${{ steps.trial.outputs.mergeable }}
      conflicts: ${{ steps.trial.outputs.conflicts }}
      base_sha: ${{ steps.list.outputs.base_sha }}
    steps:
      - id: list
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # on a push to main this is exactly the commit that was pushed; on
          # any other event resolve the branch instead
          PUSH_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          base="$PUSH_SHA"
          if [ -z "$base" ]; then
            base=$(gh api "repos/$REPO/commits/heads/main" --jq .sha)
          fi
          echo "base_sha=$base" >> "$GITHUB_OUTPUT"

          # every open pull request, including drafts and conflicting ones;
          # mergeability is decided by the step below, which tries the merge,
          # rather than by the `mergeable` field, which reads UNKNOWN until
          # GitHub gets round to computing it
          prs=$(gh pr list -R "$REPO" --state open --limit 100 \
                  --json number --jq '[.[] | .number] | sort')
          echo "prs=$prs" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.list.outputs.base_sha }}
          fetch-depth: 0
          path: base

      - id: trial
        name: Which open pull requests merge onto the base
        working-directory: base
        env:
          PRS: ${{ steps.list.outputs.prs }}
          BASE: ${{ steps.list.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name  "merged-tree check"
          git config user.email "merged-tree-check@invalid"

          mergeable=()
          conflicts=()
          for n in $(echo "$PRS" | jq -r '.[]'); do
            git checkout --detach --quiet "$BASE"
            git reset --hard --quiet "$BASE"
            git fetch --no-tags --quiet origin "refs/pull/$n/head:refs/remotes/pr/$n"
            if git merge --no-edit --no-ff -q "refs/remotes/pr/$n" >/dev/null 2>&1; then
              mergeable+=("$n")
            else
              # `git merge --abort` exits 128 when the merge failed WITHOUT
              # leaving MERGE_HEAD ("refusing to merge unrelated histories"),
              # and under `set -euo pipefail` that would end this loop with no
              # lists published at all
              git merge --abort || git reset --hard "$BASE"
              conflicts+=("$n")
            fi
          done

          # `printf` with no arguments still prints its format once, so an
          # empty list comes out as `[]` rather than as a malformed value
          as_json() { printf '%s\n' "$@" | jq -R 'select(length > 0) | tonumber' | jq -sc .; }
          m=$(as_json "${mergeable[@]+"${mergeable[@]}"}")
          c=$(as_json "${conflicts[@]+"${conflicts[@]}"}")
          echo "mergeable=$m" >> "$GITHUB_OUTPUT"
          echo "conflicts=$c" >> "$GITHUB_OUTPUT"

          {
            echo "## merged-tree check"
            echo
            echo "base: \`$BASE\`"
            echo
            echo "open pull requests: \`$PRS\`"
            echo
            echo "merge onto the base, and are tested: \`$m\`"
            echo
            echo "conflict with the base, so no tree exists to test: \`$c\`"
          } >> "$GITHUB_STEP_SUMMARY"

  conflicts:
    needs: enumerate
    if: needs.enumerate.outputs.conflicts != '[]'
    runs-on: ubuntu-latest
    name: "PRs that conflict with main (left untested)"
    steps:
      # dropping the conflicting pull requests from the matrix must not also
      # drop them out of sight: name them where the run is read
      - env:
          CONFLICTS: ${{ needs.enumerate.outputs.conflicts }}
          BASE: ${{ needs.enumerate.outputs.base_sha }}
        run: |
          set -euo pipefail
          echo "### conflicts with \`$BASE\`, so no merged tree exists to test" \
            >> "$GITHUB_STEP_SUMMARY"
          for n in $(echo "$CONFLICTS" | jq -r '.[]'); do
            echo "- #$n: needs a hand merge; not tested" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::#$n conflicts with $BASE and was not tested"
          done

  per-pr:
    needs: enumerate
    if: needs.enumerate.outputs.mergeable != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        # only the pull requests that merge cleanly onto the base: a
        # conflicting one must not get a job that concludes success without
        # having run anything
        pr: ${{ fromJson(needs.enumerate.outputs.mergeable) }}
    name: "PR #${{ matrix.pr }} merged into main"
    steps:
      # the workspace root holds THIS workflow's ref, which is where the
      # suite definition below is read from; the tree under test is built in
      # `merged/`.  Keeping the two apart means the pull request being judged
      # does not supply the thing judging it, and it is also the only way the
      # check can run before the composite action reaches `main`.
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.enumerate.outputs.base_sha }}
          fetch-depth: 0
          path: merged

      - name: Merge PR #${{ matrix.pr }} onto the base
        working-directory: merged
        env:
          PR: ${{ matrix.pr }}
          BASE: ${{ needs.enumerate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name  "merged-tree check"
          git config user.email "merged-tree-check@invalid"
          git fetch --no-tags origin "refs/pull/$PR/head:refs/remotes/pr/$PR"
          git checkout --detach "$BASE"
          # `enumerate` merged this pull request onto this same base a few
          # minutes ago, so a conflict here means its head moved mid-run:
          # stop, rather than report on a tree that was never built
          if ! git merge --no-edit --no-ff "refs/remotes/pr/$PR"; then
            git merge --abort || git reset --hard "$BASE"
            echo "::error::#$PR merged onto $BASE during enumeration but conflicts now"
            exit 1
          fi
          echo "- #$PR: merged onto \`$BASE\`, running the suite" >> "$GITHUB_STEP_SUMMARY"

      # The suite's exit status is this job's exit status, and this step is
      # UNCONDITIONAL: an `if:` here is how a job comes to conclude success
      # without having run the suite.
      - uses: ./.github/actions/pytest-suite
        with:
          path: merged

  all-together:
    needs: enumerate
    if: needs.enumerate.outputs.mergeable != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    name: "every open PR merged together"
    steps:
      # as above: suite definition from this workflow's ref, tree under test
      # in `merged/`
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.enumerate.outputs.base_sha }}
          fetch-depth: 0
          path: merged

      - name: Merge every mergeable PR onto the base
        working-directory: merged
        env:
          PRS: ${{ needs.enumerate.outputs.mergeable }}
          BASE: ${{ needs.enumerate.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name  "merged-tree check"
          git config user.email "merged-tree-check@invalid"
          git checkout --detach "$BASE"
          echo "### every open PR merged together" >> "$GITHUB_STEP_SUMMARY"
          for n in $(echo "$PRS" | jq -r '.[]'); do
            git fetch --no-tags origin "refs/pull/$n/head:refs/remotes/pr/$n"
            # each of these merges onto the BASE on its own; they can still
            # conflict with ONE ANOTHER, which is information about this
            # combined tree rather than a failure of the job
            before=$(git rev-parse HEAD)
            if git merge --no-edit --no-ff "refs/remotes/pr/$n"; then
              echo "- #$n: merged" >> "$GITHUB_STEP_SUMMARY"
            else
              # `--abort` exits 128 when the merge left no MERGE_HEAD; under
              # `set -euo pipefail` that would end the loop and leave the
              # combined tree -- the one arrangement that sees a two-branch
              # interaction -- unbuilt
              git merge --abort || git reset --hard "$before"
              echo "- #$n: CONFLICT with the tree so far, left out" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          echo >> "$GITHUB_STEP_SUMMARY"
          echo "tree under test: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"

      # unconditional, as in `per-pr`: the suite's exit status is the job's
      - uses: ./.github/actions/pytest-suite
        with:
          path: merged
