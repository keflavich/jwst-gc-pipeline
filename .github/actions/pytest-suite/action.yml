name: pytest suite
description: >-
  Install the package and run the unit-test suite against a checked-out tree.
  Factored out of tests.yml so that the merged-tree check
  (retest-open-prs.yml) runs the SAME environment and the SAME pytest
  invocation, instead of a second copy that can drift away from it.

inputs:
  path:
    description: >-
      Directory holding the tree to test, relative to the workspace.  The
      merged-tree check builds its merge in a subdirectory so that this
      definition is read from the workflow's own ref rather than from the
      pull request being judged by it.
    required: false
    default: '.'

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip

    - name: Install package + test deps
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        # the repo tag style (v1.0-2026.06) is unparseable by setuptools_scm;
        # CI does not need a real version.  MUST be package-scoped: the
        # unscoped variable leaks into every scm-built sdist in the same
        # pip run (it broke dust_extinction's build).
        SETUPTOOLS_SCM_PRETEND_VERSION_FOR_JWST_GC_PIPELINE: 0.0.dev0
      run: |
        python -m pip install --upgrade pip
        pip install -e .[test]

    - name: Install flystar (one pinned commit, on PYTHONPATH)
      shell: bash
      env:
        FLYSTAR_DIR: ${{ runner.temp }}/flystar
        # MovingUniverseLab/flystar main as of 2025-06-09 ("Update index.rst")
        FLYSTAR_SHA: 3f0feeb959e01130b51d553acb9faa119576dea9
      # The multi-epoch proper-motion tests (astrometry/tests, treasury_pm_satstar_offset) need flystar; without
      # it they skip, so the builder side of the position-correction hook was untested in CI.  flystar is not on
      # PyPI and `pip install` of its git source fails on current Pythons: its build-system.requires pins
      # cython==0.29.14, which cannot be built for Python >= 3.10, and with that pin bypassed its pyproject.toml
      # (no requires-python) makes current setuptools raise a TypeError.  The package is pure Python, so one
      # fixed commit on PYTHONPATH is enough.  pandas is imported by flystar.fit_velocity but not declared by
      # flystar.
      run: |
        pip install pandas
        git init --quiet "$FLYSTAR_DIR"
        git -C "$FLYSTAR_DIR" fetch --quiet --depth 1 https://github.com/MovingUniverseLab/flystar.git "$FLYSTAR_SHA"
        git -C "$FLYSTAR_DIR" checkout --quiet FETCH_HEAD
        test "$(git -C "$FLYSTAR_DIR" rev-parse HEAD)" = "$FLYSTAR_SHA"
        PYTHONPATH="$FLYSTAR_DIR" python -c "import flystar.startables"
        echo "PYTHONPATH=$FLYSTAR_DIR${PYTHONPATH:+:$PYTHONPATH}" >> "$GITHUB_ENV"

    - name: Run test suite (local-survey-data tests auto-skip)
      shell: bash
      working-directory: ${{ inputs.path }}
      env:
        # CRDS is never contacted by the unit tests, but imports want the vars
        CRDS_PATH: ${{ runner.temp }}/crds
        CRDS_SERVER_URL: https://jwst-crds.stsci.edu
        # saturated_star_finding refuses to import without STPSF_PATH; the
        # unit tests never compute a PSF, so an empty dir satisfies it
        STPSF_PATH: ${{ runner.temp }}/stpsf-data
        WEBBPSF_PATH: ${{ runner.temp }}/stpsf-data
        MPLBACKEND: Agg
      # pytest's exit status is the step's exit status.  Do not wrap this in a
      # conditional, a `|| true`, or a grep over its output: PR #374 reported
      # green on a tree that could not import because it discarded the exit
      # code and looked for "ERROR" lines that `-rf` never prints.
      run: |
        mkdir -p "$STPSF_PATH"
        pytest jwst_gc_pipeline tests -q -rs --color=yes
