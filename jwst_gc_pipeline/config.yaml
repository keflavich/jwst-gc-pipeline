# How to run the pipeline on this machine.
#
# What ships here are HiPerGator's settings, because that is where the survey
# runs. To run somewhere else, copy this file, edit it, and point
# GC_PIPELINE_CONFIG at your copy:
#
#     cp jwst_gc_pipeline/config.yaml ~/my-cluster.yaml
#     export GC_PIPELINE_CONFIG=~/my-cluster.yaml
#
# Anything you leave out falls back to the value here, so a copy need only
# contain what differs.

# 'slurm' submits jobs; 'local' runs each stage in turn in the current shell.
# A cutout run defaults to 'local' whatever this says — it takes minutes.
scheduler: slurm

slurm:
  account: astronomy-dept
  qos: astronomy-dept-b
  partition: hpg-default
  # The default QOS on HiPerGator has a much lower CPU cap, and a job that asks
  # for more than the cap never starts.
  log_dir: /orange/adamginsburg/jwst/logs

# Exported into every job. Values here are read at submit time, so a variable
# already set in your environment wins.
environment:
  CRDS_PATH: /orange/adamginsburg/jwst/crds
  CRDS_SERVER_URL: https://jwst-crds.stsci.edu
  STPSF_PATH: /orange/adamginsburg/jwst/stpsf-data
  # Any checkout that is not sitting on a release tag needs this.
  GC_ALLOW_DEV: '1'

# The interpreter jobs run with. Leave empty to use whichever python submitted.
python: /blue/adamginsburg/adamginsburg/miniconda3/envs/python313/bin/python

# Scratch for intermediates. SLURM's node-local directory is used when set.
tmpdir: /blue/adamginsburg/adamginsburg/tmp

stages:
  reduce:
    submit_script: scripts/reduction/submit_reduction.sbatch
    cpus: 16
    memory: 128gb
    walltime: '24:00:00'
    # 'filter' -> one array task per filter.
    fan_out: filter
    # Reuse the *_cal files already on disk rather than re-fitting ramps.
    skip_step1and2: true
    modules: merged

  catalog:
    submit_script: scripts/reduction/submit_cataloging.sbatch
    cpus: 32
    memory: 128gb
    walltime: '48:00:00'
    fan_out: filter
    modules: merged

  merge:
    submit_script: scripts/reduction/submit_merge.sbatch
    cpus: 4
    memory: 64gb
    walltime: '08:00:00'
    # 'program-filter' -> one array task per (program, filter), then a single
    # job that combines the filters once the array finishes.
    fan_out: program-filter

# Defaults for --cutout-region runs, which exist to exercise the whole chain in
# minutes rather than a day.
cutout:
  scheduler: local
  size_arcsec: 20.0
