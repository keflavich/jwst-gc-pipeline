# How to run the pipeline on this machine.
#
# What ships here are HiPerGator's settings, because that is where the survey
# runs. To run somewhere else, copy this file, edit it, and point
# GC_PIPELINE_CONFIG at your copy:
#
#     cp jwst_gc_pipeline/config.yaml ~/my-cluster.yaml
#     export GC_PIPELINE_CONFIG=~/my-cluster.yaml
#
# Anything you leave out falls back to the value here, so a copy need only
# contain what differs.

# 'slurm' submits jobs; 'local' runs each stage in turn in the current shell.
scheduler: slurm

slurm:
  account: astronomy-dept
  # The default QOS on HiPerGator has a much lower CPU cap, and a job that asks
  # for more than the cap never starts.
  qos: astronomy-dept-b
  partition: hpg-default
  # Where job logs land.  The submit scripts carry the same path in an #SBATCH
  # directive, which SLURM reads before any shell runs and so cannot expand a
  # variable; the runner passes --output explicitly, which overrides it.  The
  # directory is created if it does not exist.
  log_dir: /orange/adamginsburg/jwst/logs

# Exported into every job. Values here are read at submit time, so a variable
# already set in your environment wins.
environment:
  CRDS_PATH: /orange/adamginsburg/jwst/crds
  CRDS_SERVER_URL: https://jwst-crds.stsci.edu
  STPSF_PATH: /orange/adamginsburg/jwst/stpsf-data
  # Any checkout that is not sitting on a release tag needs this.
  GC_ALLOW_DEV: '1'

# The interpreter jobs run with.  This is one HiPerGator account's conda env:
# on any other machine, set your own or leave it empty to use whichever python
# submitted the job.
python: /blue/adamginsburg/adamginsburg/miniconda3/envs/python313/bin/python

stages:
  reduce:
    # Per instrument: each has its own stage-1 driver.  An instrument with no
    # entry here has no submit script, and the runner says so rather than
    # submitting another instrument's.
    submit_script:
      nircam: scripts/reduction/submit_reduction.sbatch
      niriss: scripts/reduction/submit_reduction_niriss.sbatch
      miri: scripts/reduction/submit_reduction_miri.sbatch
    cpus: 16
    memory: 128gb
    walltime: '24:00:00'
    # 'filter' -> one array task per filter.
    fan_out: filter
    # Reuse the *_cal files already on disk rather than re-fitting ramps.
    skip_step1and2: true
    modules: merged

  catalog:
    submit_script:
      nircam: scripts/reduction/submit_cataloging.sbatch
      niriss: scripts/reduction/submit_cataloging_niriss.sbatch
      miri: scripts/reduction/submit_cataloging.sbatch
    cpus: 32
    memory: 128gb
    walltime: '48:00:00'
    fan_out: filter
    modules: merged

  merge:
    submit_script:
      nircam: scripts/reduction/submit_merge.sbatch
      miri: scripts/reduction/submit_merge.sbatch
      niriss: scripts/reduction/submit_merge.sbatch
    cpus: 4
    memory: 64gb
    walltime: '08:00:00'
    # 'program-filter' -> one array task per (program, filter), then a single
    # job that combines the filters once the array finishes.
    fan_out: program-filter

# --cutout-region runs, which exercise reduce and catalog in minutes rather than
# a day.  Only the local path carries the region into the command, so the runner
# refuses a cutout when this says anything else rather than silently cataloging
# the whole observation.
cutout:
  scheduler: local
