        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2026.30.fits
          '002': catalogs/gaia_virac2_refcat_epoch2026.30.fits
        nvisits: 7
        reference_frame: VIRAC2
        obsids:
          nircam: ['001']
          miri: ['002']
        filters: [f115w, f162m, f182m, f200w, f356w, f405n, f444w, f470n,
                  f770w, f1000w, f1500w, f2100w, f2550w]

