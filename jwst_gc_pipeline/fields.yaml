          nircam: '*'
          miri: '*'
        filters: [f212n, f480m, f770w]

  # gc2211's five observations are DIFFERENT TARGET FIELDS -- different sky,
  # different epochs -- that shared a proposal id and therefore one directory,
  # and nothing else.  Pooling them produced a single untokened merged catalog
  # covering five fields, and five concurrent chains all writing that one name.
  # Split into one tree per observation on 2026-08-21: 69,815 files moved,
  # receipt gc2211/_SPLIT_per_observation_20260821T202441Z.json, offsets table
  # partitioned 296 -> 16/96/96/64/24 rows with every offset copied unchanged.
  #
  # o028 keeps its OWN reference catalogue.  Its pointing is ~13' south of the
  # other four and falls entirely outside the shared one -- zero stars within
  # 3.6' -- so the shared file would leave its m2 with no reference at all.
  # ###################################################################
  # gc2211_o023 -- JUNK.  Do not queue.
  #
  # All four exposures carry serious tracking errors and are listed in
  # reduction/exposure_exclusions.py, so this observation contributes NOTHING
  # to the survey.  The entry is kept rather than deleted so the field stays
  # named and its history readable; cataloging it now raises a distinct
  # "everything matched was excluded" error rather than producing a thin
  # catalog.  Assessed on the raw _cal pixels (operator decision 2026-08-22);
  # see jwst-gc-pipeline#484.  Its sibling observations 028/046/049/050 are
  # unaffected and are being processed normally.
  # ###################################################################
  gc2211_o023:
    root: orange
    observations:
      '2211':
        reference_catalog:
          '023': catalogs/gaia_virac2_refcat_epoch2023.71.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['023']
        filters: [f200w, f277w]
    # 266.4085 -28.9580, observed 2023-09-15

  gc2211_o028:
    root: orange
    observations:
      '2211':
        reference_catalog:
          '028': catalogs/gaia_virac2_refcat_epoch2023.71_o028.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['028']
        filters: [f150w, f277w]
    # 266.3537 -29.1777, observed 2023-09-14

  gc2211_o046:
    root: orange
    observations:
      '2211':
        reference_catalog:
          '046': catalogs/gaia_virac2_refcat_epoch2023.71.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['046']
        filters: [f200w, f277w]
    # 266.4959 -28.8372, observed 2024-04-25

  gc2211_o049:
    root: orange
    observations:
      '2211':
        reference_catalog:
          '049': catalogs/gaia_virac2_refcat_epoch2023.71.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['049']
        filters: [f200w, f277w]
    # 266.4047 -28.9588, observed 2024-08-19

  gc2211_o050:
    root: orange
    observations:
      '2211':
        reference_catalog:
          '050': catalogs/gaia_virac2_refcat_epoch2023.71.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['050']
        filters: [f200w, f277w]
    # 266.4803 -28.9098, observed 2025-04-21

  # gc1266 -- MIRI imaging from 1266, "NIRSpec & MIRI Integral-Field
  # Spectroscopy of the Galactic Center" (PI Garcia Marin).  The program is an
  # IFU program; the imaging is the companion/background exposures taken
  # alongside it, and it is real GC imaging that nothing else in this pipeline
  # covers.  Only the MIRI/IMAGE products are registered here -- the MIRI/IFU
  # (CH1..CH4) and NIRSPEC/IFU observations of the same program are cubes and
  # are not this pipeline's business.  The imaging filter names never collide
  # with the IFU channel names, so the driver's filter mask selects the imaging
  # cleanly.
  #
  # FOUR OBSERVATIONS, FOUR DIFFERENT POINTINGS.  Measured from the MAST
  # s_region polygons of the MIRI/IMAGE products (2026-09-07), which are the
  # imaging footprints and are NOT the target coordinates -- the imaging sits
  # off the IFU prime:
  #
  #     obs   footprint centre           radius   epoch
  #     004   266.42234  -29.04033       1.37'    2023.71
  #     008   266.42345  -29.04108       1.37'    2024.63
  #     009   266.43911  -28.99549       1.58'    2025.30
  #     010   266.45938  -29.00409       1.36'    2025.30
  #
  # 004 and 008 repeat one pointing two epochs apart; 009 and 010 are two
  # further pointings.  They span 2.87' about (266.43624, -29.01889), so no one
  # reference catalog is right for all four and each observation carries its
  # own -- exactly the gc2211 o023 lesson (a neighbour's catalog produced a
  # -9.28" per-exposure "correction").  1266 is registered in
  # photometry/naming.py as a per-observation MERGE proposal for the same
  # reason: the four share this one tree.
  gc1266:
    root: orange
    observations:
      '1266':
        reference_catalog:
          '004': catalogs/gaia_virac2_refcat_epoch2023.71_o004.fits
          '008': catalogs/gaia_virac2_refcat_epoch2024.63_o008.fits
          '009': catalogs/gaia_virac2_refcat_epoch2025.30_o009.fits
          '010': catalogs/gaia_virac2_refcat_epoch2025.30_o010.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          miri: ['004', '008', '009', '010']
        filters: [f560w, f770w, f1130w]

  # gc3571 -- MIRI imaging of the CMZ from 3571, "MIRI observations of YSO
  # candidates for Unambiguous Evidence of Star formation in the 10pc Molecular
  # Ring Orbiting the Galactic Center Black Hole" (PI Yusef-Zadeh).  Five tiles
  # around Sgr A*, five filters each, MIRI/IMAGE only -- the whole program is
  # imaging.
  #
  # FIVE OBSERVATIONS, FIVE TILES.  Footprint centres from the MAST s_region
  # polygons (2026-09-07); every tile has the same 1.79' footprint radius:
  #
  #     obs   tile     footprint centre           epoch
  #     001   Tile-1   266.43947  -28.99084       2024.32
  #     003   Tile-2   266.39649  -29.00772       2024.67
  #     004   Tile-3   266.42927  -29.01072       2024.63
  #     005   Tile-4   266.42814  -29.02890       2024.67
  #     016   Tile-6   266.40528  -28.98727       2025.24
  #
  # Tile-5 was never delivered; the plan's numbering is not contiguous, which
  # is why the observation numbers are listed rather than wildcarded.  The
  # tiles span 3.22' about (266.41973, -29.00509) and adjoin one another, so
  # each carries its own reference catalog and 3571 is a per-observation MERGE
  # proposal in photometry/naming.py.
  gc3571:
    root: orange
    observations:
      '3571':
        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2024.32_o001.fits
          '003': catalogs/gaia_virac2_refcat_epoch2024.67_o003.fits
          '004': catalogs/gaia_virac2_refcat_epoch2024.63_o004.fits
          '005': catalogs/gaia_virac2_refcat_epoch2024.67_o005.fits
          '016': catalogs/gaia_virac2_refcat_epoch2025.24_o016.fits
        # nvisits is scanned as visit ids 001..nvisits for EVERY observation of
        # the proposal, so it has to cover the largest visit number any of them
        # used, not the count of visits each one has.  o001's exposures are
        # `jw03571001003_...` -- visit 003 -- while o003/o004/o005/o016 are all
        # visit 001.  At nvisits: 1 the preflight scanned only visit 001 and
        # o001 resolved to zero frames in all five bands, so its whole m12
        # fan-out raised `RequestedFilterHasNoFramesError` (jobs 41873323_*,
        # 2026-09-12) even though its 8 exposures per filter were on disk.
        # The extra empty visits cost nothing: each per-visit glob is
        # allow_empty.
        nvisits: 3
        reference_frame: VIRAC2
        obsids:
          miri: ['001', '003', '004', '005', '016']
        filters: [f560w, f770w, f1000w, f1280w, f1500w]

  # gc9257 -- NIRCam + NIRISS imaging of the nuclear star cluster from program
  # 9257 (PI Tuan Do), target NSC_CENTRAL.  ONE observation, o001, delivered
  # 2025-09-10 (epoch 2025.691), all products PUBLIC, level-3 associations
  # published (three image3 asn, one per band), so it is reducible as delivered.
  #
  # Do NOT confuse this with HST program 9257 (WFPC2 calibration, PI Mack,
  # targets HD14069/HD2222): a bare proposal_id='9257' MAST query returns both,
  # and only the JWST half is this pipeline's business.
  #
  # THREE VISITS (001/002/003).  nvisits is the MAX visit id and the scan walks
  # 001..nvisits for EVERY observation, so 3 is required -- at 1 it would drop
  # two thirds of the exposures the way cloudef did (#853).
  #
  # Footprint centres measured from the MAST s_region polygons (2026-09-17),
  # NOT from s_ra/s_dec, which report the TARGET position (266.416833
  # -29.007894) identically for all three bands and so hide the fact that these
  # are three different pointings -- NIRISS sits ~6' NW of the NIRCam field:
  #
  #     band             centre                    radius   uncal
  #     F212N  (NIRCam)  266.406227  -29.008725     4.75'     576
  #     F480M  (NIRCam)  266.412207  -29.016118     4.51'     144
  #     F140M  (NIRISS)  266.344774  -28.933504     3.60'      72
  #
  # One obsid means one reference catalog, so it has to span all three
  # footprints; the catalog below is built on a cone covering NIRCam and NIRISS
  # together rather than on either band alone.
  #
  # NIRISS has no offsets-table correction channel (PR #832 opened MIRI's;
  # NIRISS still has none), so F140M reduces at its dispatched frame and only
  # the NIRCam bands can be table-corrected.
  gc9257:
    root: orange
    observations:
      '9257':
        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2025.69_o001.fits
        nvisits: 3
        reference_frame: VIRAC2
        obsids:
          nircam: ['001']
          niriss: ['001']
        filters: [f212n, f480m]
        niriss_filters: [f140m]

