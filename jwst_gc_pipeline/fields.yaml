  sgra:
    root: orange
    fov_region: regions_/nircam_sgra_fov.reg
    observations:
      '1939':
        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2022.72.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['001']
        filters: [f115w, f212n, f405n]

  sgrb2:
    root: orange
    fov_region: regions_/nircam_sgrb2_fov.reg
    # A MIRI FOV region was recorded as the string 'nope' before this file
    # existed.  Only the NIRCam driver reads fov_region, so it was never used.
    observations:
      '5365':
        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2024.68.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['001']
          # 002 and 998 ('..._skipped_redo') tile the full field between them.
          miri: ['001', '002', '998']
        # Both must be cataloged together or the mosaic is missing half its data.
        joint_obsids:
          miri: ['002-998']
        filters: [f150w, f182m, f187n, f210m, f212n, f300m, f360m, f405n, f410m, f466n, f480m, f770w, f1280w, f2550w]

  sgrc:
    root: orange
    fov_region: regions_/nircam_sgrc_fov.reg
    observations:
      '4147':
        reference_catalog:
          '012': catalogs/gaia_virac2_refcat_epoch2023.72.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['012']
          niriss: ['012']
        filters: [f115w, f162m, f182m, f212n, f360m, f405n, f470n, f480m]
        niriss_filters: [f158m, f200w, f356w, f480m]

  sickle:
    root: orange
    fov_region: regions_/nircam_sickle_fov.reg
    observations:
      '3958':
        reference_catalog:
          '001':
            - catalogs/pipeline_based_nircam-f210m_reference_astrometric_catalog.fits
            - catalogs/gaia_virac2_refcat_epoch2024.64.fits
          '002':
            - catalogs/pipeline_based_nircam-f210m_reference_astrometric_catalog.fits
            - catalogs/gaia_virac2_refcat_epoch2024.64.fits
          '007': catalogs/gaia_virac2_refcat_epoch2024.64.fits
        nvisits: 1
        reference_frame: VIRAC2
        # NIRCam is obs 007 ONLY.  001 and 002 are MIRI observations; listing
        # them under `nircam` made every consumer expect the five NIRCam filters
        # from them, and the monitor rendered two observations with all five
        # "missing" on a field whose NIRCam half is fine (528 m7 per-frame
        # catalogs on disk, three filters merged through m7).  Counted from disk
        # 2026-08-19: F187N/F210M 96 `_cal` each and F335M/F470N/F480M 24 each,
        # every one obs 007.  `run_sickle_3958_o007.sh` says the same in prose --
        # "NIRCam is obs 007.  The 3958 MIRI data are obs 001".
        #
        # 3958/003 exists on disk (F770W/F1130W/F1500W, 5 frames each) and is
        # NOT sickle's: brick claims it above with its own reference catalogs,
        # and `TARGPROP = SICKLE-MIR-BACKGROUND` marks it a dedicated background
        # pointing rather than a science field -- a different kind of thing from
        # the POS1/POS2 beside it.  Adding it here is a double-claim.  (Distance
        # does not decide this: all three 3958 MIRI pointings are nearer brick's
        # NIRCam centre than sickle's, because the 3958 MIRI footprint sits ~14'
        # from the 3958 NIRCam one.)
        obsids:
          nircam: ['007']
          miri: ['001', '002']
        # Both of sickle's MIRI observations are cataloged in one run; this
        # token names that run, and get_filenames globs both.
        joint_obsids:
          miri: ['001-002']
        glob_obsid:
          nircam: '*'
        filters: [f187n, f210m, f335m, f470n, f480m, f770w, f1130w, f1500w]

  w51:
    root: orange
    fov_region: regions_/nircam_w51_fov.reg
    # A MIRI FOV region was recorded as the string 'nope' before this file
    # existed.  Only the NIRCam driver reads fov_region, so it was never used.
    observations:
      '6151':
        reference_catalog:
          '001': catalogs/gaia_refcat.fits
        nvisits: 2
        reference_frame: Gaia
        obsids:
          nircam: ['001']
          # MIRI obs 001 was labelled 'w51_background' by the reduce driver
          # alone.  No such tree exists; its products are in w51/, and the
          # catalog stage always treated both as w51.
          miri: ['001', '002']
        glob_obsid:
          miri: '002'
        # NIRCam f150w/f444w and MIRI f560w/f1000w were observed by 6151 and
        # are reduced on disk (128/32/32/32 crf), but were absent here.  A
        # cataloging run that included them died at the m12 finalize:
        #   KeyError: filter 'f150w' not observed by target 'w51'
        # after the fan-out had completed (job 39893953, 2026-08-22).
        filters: [f140m, f150w, f162m, f182m, f187n, f210m, f335m, f360m,
                  f405n, f410m, f444w, f480m, f560w, f770w, f1000w, f1280w,
                  f2100w]

  wd1:
