          '139': catalogs/gaia_virac2_refcat_epoch2026.69_o139.fits
        nvisits: 1
        # The alignment SOURCE is alignment_config.py's 10678 entry
        # (TABLE_CONSENSUS), which names Offsets_JWST_Brick10678_consensus.csv
        # on its own; this token only supplies `refname` on the fallback path
        # and the frame the realignment gate -- the pre-reduction check that a
        # field's reference catalog is in the frame its offsets were measured
        # in -- checks a refcat against.  Kept
        # for the same reason arches/quintuplet/sgrc keep theirs -- the tie IS
        # to VIRAC2 and a silent 'NONE' frame stamp is worse than a redundant
        # one.
        reference_frame: VIRAC2
        # '*' claims every observation of the proposal for that instrument.
        # 10678's 139 observation numbers are published today, and this field
        # owns all of them -- the wildcard records that ownership, which
        # survives a replan that renumbers or adds observations, in place of a
        # 139-entry list that would need regenerating each time.  Enumerate
        # instead for any proposal whose observations are split between
        # fields: the wildcard takes an obsid outside the plan as this field's
        # rather than raising.  Note this is a SCALAR: it is the only scalar
        # the loader accepts, and any other raises (a bare '001' would load as
        # ('0', '0', '1')).
