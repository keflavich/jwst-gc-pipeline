# Every field this pipeline knows about, and every observation of it.
#
# This file is the single place a new target is registered.  Edit it, and the
# reduce, catalog and merge stages all pick the target up; nothing else needs
# changing.  jwst_gc_pipeline/fields.py loads it and derives the lookups the
# pipeline uses.  See docs/FIELDS.md.
#
# ORDER HERE MEANS NOTHING.  Write entries wherever they read best; the loader
# sorts proposals numerically and filters by wavelength, so what the pipeline
# sees is the same whatever order you use.

# The two data trees.  A field's `root:` names one of these, and this is the
# only place the absolute paths appear.
roots:
  orange: /orange/adamginsburg/jwst
  blue: /blue/adamginsburg/adamginsburg/jwst

fields:

  arches:
    root: orange
    fov_region: regions_/nircam_arches_fov.reg
    observations:
      '2045':
        reference_catalog:
          '001': catalogs/gaia_virac2_refcat_epoch2023.64.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['001']
        filters: [f212n, f323n]

  brick:
    root: blue
    fov_region: regions_/nircam_brick_fov.reg
    observations:
      '1182':
        reference_catalog:
          '004': catalogs/gaia_virac2_refcat_epoch2022.70.fits
        reference_catalog_by_filter:
          '004':
            f115w: catalogs/gaia_virac2_refcat_epoch2022.70.fits
        nvisits: 2
        reference_frame: VIRAC2
        obsids:
          nircam: ['004']
        # Measured from the data once and locked in.  Relative to this field's
        # directory.
        offsets_table: offsets/Offsets_JWST_Brick1182_F444ref.csv
        filters: [f115w, f200w, f356w, f444w]
      '2221':
        reference_catalog:
          '002':
            - catalogs/pipeline_based_nircam-f182m_reference_astrometric_catalog.fits
            - catalogs/twomass.fits
          '001': catalogs/gaia_virac2_refcat_epoch2022.70.fits
        nvisits: 2
        # No frame token.  2221 aligns from the locked offsets table declared in
        # reduction/alignment_config.py, which is also where its frame (VIRAC2)
        # is declared.  The token here names a legacy per-proposal table
        # filename; for 2221 that filename would be the retired F405ref table,
        # so leaving it out is deliberate.  resolve_shift raises if anything
        # tries to build that filename.
        obsids:
          nircam: ['001']
          miri: ['002']
        filters: [f182m, f187n, f212n, f405n, f410m, f466n, f2550w]
      '3958':
        reference_catalog:
          '003':
            - catalogs/pipeline_based_nircam-f182m_reference_astrometric_catalog.fits
            - catalogs/twomass.fits
        reference_frame: VIRAC2
        obsids:
          miri: ['003']

  cloudc:
    root: blue
    fov_region: regions_/nircam_cloudc_fov.reg
    observations:
      '2221':
        reference_catalog:
          '001':
            - catalogs/pipeline_based_nircam-f182m_reference_astrometric_catalog.fits
            - catalogs/twomass.fits
          '002': catalogs/gaia_virac2_refcat_epoch2023.30.fits
        nvisits: 2
        # No frame token.  2221 aligns from the locked offsets table declared in
        # reduction/alignment_config.py, which is also where its frame (VIRAC2)
        # is declared.  The token here names a legacy per-proposal table
        # filename; for 2221 that filename would be the retired F405ref table,
        # so leaving it out is deliberate.  resolve_shift raises if anything
        # tries to build that filename.
        obsids:
          nircam: ['002']
          miri: ['001']
        filters: [f182m, f187n, f212n, f405n, f410m, f466n, f2550w]
      '2526':
        reference_catalog:
          '021':
            - catalogs/gaia_virac2_refcat_epoch2023.30.fits
            - catalogs/pipeline_based_nircam-f182m_reference_astrometric_catalog.fits
            - catalogs/twomass.fits
        nvisits: 1
        obsids:
          miri: ['021']
        filters: [f770w]

  # 2092 images TWO pointings 11.77' apart, and they are different things:
  #
  #   002  CLOUDEF-CENTER      266.68578 -28.51733   320 frames  2023-03-19
  #   005  CLOUDEF-REFERENCE   266.46581 -28.48404   160 frames  2023-03-20
  #
  # (centres measured from the `_cal` CRVALs, 2026-08-20; the TARGPROP headers
  # say which is which.)  They do not overlap -- a NIRCam mosaic is ~5' -- so
  # pooling them was never right, and one field entry made the pipeline do
  # exactly that: both restart at visit 001 / vgroup 02101, their per-frame
  # catalog names collided, and the merged catalogs came out spanning 15' in RA
  # in two disjoint lobes with an empty 9' gap between them (172 such products
  # tagged `.STALE_obscollision_20260820`).
  #
  # Separate FIELDS, not just separate observation tokens: a control field and
  # a science field share no sources, so nothing downstream -- merge, crossband,
  # release -- should ever have the chance to associate them.
  cloudef:
    root: orange
    fov_region: regions_/nircam_cloudef_fov.reg
    observations:
      '2092':
        reference_catalog:
          '002': catalogs/gaia_virac2_refcat_epoch2023.21.fits
        # Covers the largest visit id in use, not the count per observation
        # (the preflight and the phase loops scan 001..nvisits for every
        # observation of the proposal).  At `nvisits: 1` only 352 of cloudef's
        # 792 crf frames were ever cataloged: NIRCam o002 visit 002 (320
        # frames, both lineages) and MIRI o004 visits 002-015 / o006 visit 002
        # were silently skipped, and every catalog on disk is
        # `..._visit001_...`.  o004 reaches visit 015 (014 is absent), so 15.
        nvisits: 15
        reference_frame: VIRAC2
        obsids:
          nircam: ['002']
          # 004/006/008 were registered and unreduced on 2026-08-20 -- no
          # `_cal` under this tree -- so which pointing each belonged to could
          # not be measured.  They are reduced now (o004 112 crf over visits
          # 001-013+015, o006 32 over visits 001-002, o008 8 over visit 001)
          # and stay with the science field.
          miri: ['004', '006', '008']
        glob_obsid:
          nircam: '*'
          miri: '*'
        filters: [f162m, f210m, f360m, f480m, f770w, f2100w]

  cloudef_controlfield:
    root: orange
    fov_region: regions_/nircam_cloudef_fov.reg
    observations:
      '2092':
        reference_catalog:
          '005': catalogs/gaia_virac2_refcat_epoch2023.21.fits
        nvisits: 1
        reference_frame: VIRAC2
        obsids:
          nircam: ['005']
        glob_obsid:
          nircam: '*'
        filters: [f162m, f210m, f360m, f480m]

  gc-treasury:
    # The GC Treasury (program 10678): 139 observations, 001..139, the same
    # set for NIRCAM/IMAGE and MIRI/IMAGE, over ~1668 planned exposure-level
    # MAST rows (data-qa mast_monitor.py:79-83), tiling the inner Galactic
    # Centre as GC_<n> targets, every visit NIRCam F212N+F480M prime with MIRI
    # F770W parallel.  The schedule is published: the STScI visit status report
    # (https://www.stsci.edu/jwst-program-info/visits/?program=10678, fetched
    # 2026-09-02) puts observations 088-139 -- 52 of the 139 -- in state
    # Scheduled, executing back to back at ~0.9-1.5 h each from
    # 2026-09-10 19:05 UT to 2026-09-13.  The other 87 (001-087) are still in
    # Implementation.  Readiness for that window is tracked in #636.
    # The name must stay exactly 'gc-treasury': the JWST-GC/data-qa
    # repository's mast_monitor.TREASURY_FIELD routes every 10678 observation
    # to it, and the triggered reduce looks the field up under that name
    # (#413).
    # root is orange, taken 2026-09-12 by the maintainer when the first tile
    # (GC_135) landed and had to be downloaded: "10678 needs to download to
    # /orange, _not_ to /blue, and the percentage full is completely
    # irrelevant".  That settles the open question #421 and #636 carried --
    # the root was blue on a free-space comparison (/orange 97% full hosting
    # the download staging, df 2026-08-18) that had already inverted by
    # 2026-09-03 -- and it is taken BEFORE any downstream table exists, which
    # is the moment the old comment said the choice had to be made by.
    # Every 10678 product to date lives under /orange: the GC_135 uncal set
    # and the per-tile reference catalogs below.
    root: orange
    observations:
      '10678':
        # NO default_reference_catalog, and no per-observation
        # reference_catalog keys yet -- both on purpose.
        #
        # A default is consulted for every observation without an exact key,
        # so the single CMZ-wide file that used to sit here
        # (catalogs/gaia_virac2_refcat_epoch2026.65.fits, never built) named
        # ONE catalog for all 139 tiles.  Those tiles span
        # l = -0.573..+0.705, b = -0.138..+0.576 (1.28 x 0.71 deg) with
        # neighbouring centres 2.17-3.78' apart, measured off the planned MAST
        # footprints 2026-09-03, so for all but a handful that file would be
        # the WRONG SKY -- the gc2211 o023 failure, where a neighbour's
        # catalog produced a -9.28" per-exposure "correction".
        #
        # With nothing registered, reference_catalog_candidates raises its own
        # named FieldRegistryError telling the operator which block to add,
        # and BOTH ways in stop before any product is written: run_pipeline at
        # plan time, and PipelineRerunNIRCAM-LONG's own getter -- which the
        # data-qa auto-trigger reaches directly, without passing through
        # run_pipeline -- because alignment_config.reference_catalog_required
        # is True for this VIRAC2-framed proposal.  So the registry block below
        # has to be pasted before a tile can reduce; the files being on disk is
        # not enough.
        #
        # The two paths that MEASURE the tie --
        # photometry.cataloging._astrom_checkpoint_refcat (m2) and
        # reduction.bulk_offset_step0.refcat_for_frame -- glob catalogs/ and
        # select by OBSERVATION TOKEN via astrometry_utils.pick_refcat, so
        # they read the per-tile file itself and refuse to substitute another
        # tile's whatever the registry says.
        #
        # Build the per-tile catalogs with
        #   python scripts/reduction/build_treasury_refcats.py \
        #       --observations 088-139 --epoch 2026.69
        # and paste its --emit-registry output in here as
        #   reference_catalog:
        #     '088': catalogs/gaia_virac2_refcat_epoch2026.69_o088.fits
        # once the files exist.  The epoch tag is per tile (a visit's own
        # observation date), which is why the entries are written back from
        # the build rather than templated ahead of it.
        #
        # GC_134 and GC_135 are the first two tiles to fly (observed
        # 2026-09-11, released 2026-09-12); their catalogs below came from
        # that command with --observations 134 / 135.  The remaining 137
        # entries go in as their tiles land.
        # The Gaia component of every one of these came from VizieR
        # (I/355/gaiadr3), NOT the Gaia ESA TAP: the TAP silently caps at 2000
        # rows and hangs without a timeout (#856).  o134 and o135 were first
        # built through the TAP and are REBUILT here in place -- same filenames,
        # so these keys are unchanged, but 2000 -> 8794 and 2000 -> 9937 Gaia.
        # The capped originals are kept beside them as *.fits.gaia2000cap.
        reference_catalog:
          '040': catalogs/gaia_virac2_refcat_epoch2026.71_o040.fits
          '041': catalogs/gaia_virac2_refcat_epoch2026.71_o041.fits
          '042': catalogs/gaia_virac2_refcat_epoch2026.71_o042.fits
          '043': catalogs/gaia_virac2_refcat_epoch2026.71_o043.fits
          '044': catalogs/gaia_virac2_refcat_epoch2026.71_o044.fits
          '045': catalogs/gaia_virac2_refcat_epoch2026.71_o045.fits
          '046': catalogs/gaia_virac2_refcat_epoch2026.71_o046.fits
          '060': catalogs/gaia_virac2_refcat_epoch2026.71_o060.fits
          '061': catalogs/gaia_virac2_refcat_epoch2026.71_o061.fits
          '063': catalogs/gaia_virac2_refcat_epoch2026.71_o063.fits
          '064': catalogs/gaia_virac2_refcat_epoch2026.71_o064.fits
          '065': catalogs/gaia_virac2_refcat_epoch2026.71_o065.fits
          '066': catalogs/gaia_virac2_refcat_epoch2026.71_o066.fits
          '067': catalogs/gaia_virac2_refcat_epoch2026.71_o067.fits
          '068': catalogs/gaia_virac2_refcat_epoch2026.71_o068.fits
          '069': catalogs/gaia_virac2_refcat_epoch2026.71_o069.fits
          '070': catalogs/gaia_virac2_refcat_epoch2026.72_o070.fits
          '071': catalogs/gaia_virac2_refcat_epoch2026.72_o071.fits
          '072': catalogs/gaia_virac2_refcat_epoch2026.72_o072.fits
          '073': catalogs/gaia_virac2_refcat_epoch2026.72_o073.fits
          '074': catalogs/gaia_virac2_refcat_epoch2026.72_o074.fits
          '075': catalogs/gaia_virac2_refcat_epoch2026.72_o075.fits
          '076': catalogs/gaia_virac2_refcat_epoch2026.72_o076.fits
          '077': catalogs/gaia_virac2_refcat_epoch2026.72_o077.fits
          '078': catalogs/gaia_virac2_refcat_epoch2026.72_o078.fits
