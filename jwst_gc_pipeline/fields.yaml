            - catalogs/gaia_virac2_refcat_epoch2024.64.fits
          '007': catalogs/gaia_virac2_refcat_epoch2024.64.fits
        nvisits: 1
        reference_frame: VIRAC2
        # NIRCam is obs 007 ONLY.  001 and 002 are MIRI observations; listing
        # them under `nircam` made every consumer expect the five NIRCam filters
        # from them, and the monitor rendered two observations with all five
        # "missing" on a field whose NIRCam half is fine (528 m7 per-frame
