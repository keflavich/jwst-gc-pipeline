# Every field this pipeline knows about, and every observation of it.
#
# This file is the single place a new target is registered.  Edit it, and the
# reduce, catalog and merge stages all pick the target up; nothing else needs
# changing.  jwst_gc_pipeline/fields.py loads it and derives the lookups the
# pipeline uses.  See docs/FIELDS.md.
#
# ORDER HERE MEANS NOTHING.  Write entries wherever they read best; the loader
# sorts proposals numerically and filters by wavelength, so what the pipeline
# sees is the same whatever order you use.

# The two data trees.  A field's `root:` names one of these, and this is the
# only place the absolute paths appear.
roots:
  orange: /orange/adamginsburg/jwst
  blue: /blue/adamginsburg/adamginsburg/jwst

fields:

  arches:
    root: orange
    fov_region: regions_/nircam_arches_fov.reg
    observations:
      '2045':
        nvisits: 1
        reference_catalog: VIRAC2
        obsids:
          nircam: ['001']
        filters: [f212n, f323n]

  brick:
    root: blue
    fov_region: regions_/nircam_brick_fov.reg
    observations:
      '1182':
        nvisits: 2
        reference_catalog: VIRAC2
        obsids:
          nircam: ['004']
        # Measured from the data once and locked in.  Relative to this field's
        # directory.
        offsets_table: offsets/Offsets_JWST_Brick1182_F444ref.csv
        filters: [f115w, f200w, f356w, f444w]
      '2221':
        nvisits: 2
        reference_catalog: THIS_IS_A_BUG_IF_YOU_USE_THIS
        obsids:
          nircam: ['001']
          miri: ['002']
        filters: [f182m, f187n, f212n, f405n, f410m, f466n, f2550w]
      '3958':
        reference_catalog: VIRAC2
        obsids:
          miri: ['003']

  cloudc:
