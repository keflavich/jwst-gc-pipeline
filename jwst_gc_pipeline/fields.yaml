        reference_catalog:
          '005': catalogs/gaia_refcat.fits
        nvisits: 1
        reference_frame: Gaia
        obsids:
          nircam: ['003', '005']
        glob_obsid:
          nircam: '005'
        filters: [f115w, f150w, f162m, f164n, f182m, f187n, f200w, f212n, f250m, f277w, f300m, f323n, f335m, f405n, f410m, f444w, f466n]
