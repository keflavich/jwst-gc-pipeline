        # WIDE half of a serial filter pair, and with two filters in serial the
        # NARROWER one is the filter -- the wide element is only a blocker.
        # MAST reports the pairs as `F150W2;F162M` and `F444W;F405N`, and the
        # frame headers agree (FILTER=F150W2 PUPIL=F162M).  Naming the wide half
