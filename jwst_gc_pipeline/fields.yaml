      '2092':
        nvisits: 1
        reference_catalog: VIRAC2
        obsids:
          nircam: ['002', '005']
        glob_obsid:
          nircam: '*'
        filters: [f162m, f210m, f360m, f480m, f770w, f2100w]

  gc2211:
    root: orange
